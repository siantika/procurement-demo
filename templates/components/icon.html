<svg class="icon"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"

     stroke-linecap="square"
     stroke-linejoin="miter"

     focusable="false">

        <path d="M7 4H5v17h14V4h-2M9 3h6v4H9z" />

        <circle cx="19" cy="14" r="2" />

        <path d="M5 3h10l4 4v14H5zM15 3v5h4" />
        <path d="M8 12h8M8 16h5M8 19h8" />

        <path d="M6 9a6 6 0 0 1 12 0c0 7 3 7 3 7H3s3 0 3-7Z" />

        <circle cx="12" cy="8" r="4" />
        <path d="M4 21c.8-4.3 3.5-6 8-6s7.2 1.7 8 6" />
    {% elif name == "logout" %}
        <path d="M10 4H4v16h6M14 8l4 4-4 4M8 12h10" />
    {% elif name == "login" %}
        <path d="M14 4h6v16h-6M10 8l4 4-4 4M4 12h10" />
    {% else %}
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v6M12 17h.01" />
    {% endif %}
