{% extends "base.html" %}

{% block content %}
<h1>Login</h1>

{% if form.errors %}
    <p style="color:red;">Username atau password salah.</p>
{% endif %}

<form method="post">
    {% csrf_token %}

    <div>
        <label>Username</label><br>
        {{ form.username }}
    </div>

    <div>
        <label>Password</label><br>
        {{ form.password }}
    </div>

    <br>

    <button type="submit">Login</button>
</form>
{% endblock %}
